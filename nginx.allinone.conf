# Rate limit zones. Defined at http level via conf.d inclusion; the limits are
# applied per-location below. These bound how fast an anonymous caller can
# queue GPU work at the edge, before uvicorn ever sees the request.
#   - 2 req/s sustained with burst 20: a browser batch run is a handful of
#     large requests, so this never fires in normal use.
#   - 8 concurrent connections per IP: enough for parallel uploads, not enough
#     to hold every worker open.
limit_req_zone  $binary_remote_addr zone=api_rate:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "DENY"                            always;
    add_header X-XSS-Protection        "0"                               always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

    # script-src 'self' is the part that matters: the app renders OCR output
    # as Markdown, so a policy that blocks injected script is the backstop
    # behind react-markdown's own URL sanitising.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    location ^~ /api/ {
        limit_req  zone=api_rate burst=20 nodelay;
        limit_conn api_conn 8;
        limit_req_status  429;
        limit_conn_status 429;

        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Sized to the batch ceiling the backend actually enforces, not to a
        # round number: MAX_BATCH_FILES(50) x a realistic 6 MB drawing = 300 MB.
        # The old 500M let one anonymous request push half a gigabyte into
        # uvicorn before a single application-level check ran. This limit and
        # MAX_BATCH_FILES / MAX_FILE_SIZE are one setting in three places —
        # move them together.
        client_max_body_size 300M;
    }

    # index.html must never be cached. The hashed assets below are immutable
    # for a year, so a browser holding a stale index.html keeps requesting the
    # old bundle from its own disk cache and never sees a new deploy — which is
    # how a fixed image still showed "Unsupported protocol C:" on a machine that
    # had opened the broken one. `expires` (not `add_header`) so the security
    # headers inherited from the server block survive.
    location = /index.html {
        expires -1;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
