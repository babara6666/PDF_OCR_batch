# 進料檢驗報告 → ERP 欄位定義（規格析 ERP 匯入模式）
#
# 這份檔案是「單一事實來源」：後端匯出、MCP resource、知識通 skill 全部讀它。
# 要新增供應商寫法時，只加 aliases，不要動 key / name / 欄位順序 —— ERP 匯入
# 範本認的是 name 與順序。
#
# aliases 的來源是四維既有的人工對照表（key.xlsx / 測試紀錄251117.xlsx「新清單」），
# 已合併去重。它們是給知識通的**提示**，不是比對規則：欄名沒出現在清單裡時，
# 知識通仍應照語意判斷，不要因為「不在清單」就放棄該欄。

version: 1

columns:
  - key: supplier_lot
    name: 供應商批號
    required: true
    description: |
      供應商自己的批號／捲號／爐號。整份報告通常只有一個，寫在第一列即可，後續列留空。
      一份報告出現多個批號時（例如按捲分列），每個批號各自成列。
      注意：有的供應商用訂單號／L/C 號當批號，清單裡也收了這些。
    aliases:
      - "LC Number"
      - "Lot number"
      - "BATCH No"
