[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

# supervisord runs as root only so nginx can bind :80 and so it can drop
# privileges for its children. Neither child below keeps root: nginx forks
# unprivileged workers (its own default), and the backend runs as `app`.

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:backend]
command=python main.py
directory=/app/backend
# Everything that touches an uploaded file — Marker, Surya, YOLO, the fastdoc
# parsers — runs under this account, not root.
user=app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOST="0.0.0.0",PORT="8001",HOME="/home/app",HF_HOME="/models",TORCH_HOME="/models/torch",YOLO_CONFIG_DIR="/tmp/Ultralytics"
priority=20
