server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "DENY"                            always;
    add_header X-XSS-Protection        "0"                               always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

    # script-src 'self' is the part that matters: the app renders OCR output
    # as Markdown, so a policy that blocks injected script is the backstop
    # behind react-markdown's own URL sanitising.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # ^~ blocks regex locations from overriding this prefix.
    # Without it, ~* \.(png|jpg)$ would intercept /api/images/*.png → 404.
    location ^~ /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 10s;

        # Allow up to 60 MB uploads (backend limit is 50 MB)
        client_max_body_size 60M;
    }

    # Hashed static assets — safe for long-term caching
    # index.html must never be cached. The hashed assets below are immutable
    # for a year, so a browser holding a stale index.html keeps requesting the
    # old bundle from its own disk cache and never sees a new deploy — which is
    # how a fixed image still showed "Unsupported protocol C:" on a machine that
    # had opened the broken one. `expires` (not `add_header`) so the security
    # headers inherited from the server block survive.
    location = /index.html {
        expires -1;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
